name: Deploy Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - 'birim-web/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd birim-web
          npm install

      - name: Deploy Sanity Studio
        run: |
          cd birim-web
          npx sanity deploy --yes
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          # R2 Public Asset Domain (Presigned URL architecture requires zero client secrets)
          SANITY_STUDIO_R2_DOMAIN: ${{ secrets.SANITY_STUDIO_R2_DOMAIN }}
